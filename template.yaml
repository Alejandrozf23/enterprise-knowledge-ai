AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Enterprise Knowledge AI - S3 ingestion MVP

Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::Region}-${AWS::AccountId}-input"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/lambda
      Handler: lambda_handler.lambda_handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 30
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eka-lambda-ingestion-dev"

      Events:
        JsonCreated:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  - Name: suffix
                    Value: .json

        JsonlCreated:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  - Name: suffix
                    Value: .jsonl

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestionFunction}"
      RetentionInDays: 7

Outputs:
  InputBucketName:
    Value: !Ref InputBucket

  IngestionFunctionName:
    Value: !Ref IngestionFunction